<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="270" viewBox="0 0 1440 270" role="img" aria-labelledby="title desc"><title id="title">Observations are not a proven attack chain</title><desc id="desc">Four tabletop observations in time order. T1 is a document invitation; use a known route is the recommended response. T2 confirms Aina entered a code and reported. T3 confirms a bank-change request and payment on hold, with callback planned. T4 is an unsolicited help offer without a ticket. Connections between the observations are not established.</desc>
<defs><style>text {font-family:Arial,Helvetica,sans-serif;}</style><marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B4C0D2"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2DD4BF"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#FBBF24"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#FB7185"/></marker></defs>
<text id="label-1" x="14" y="23.0" font-size="20" fill="#B4C0D2" font-weight="700" text-anchor="start">TABLETOP OBSERVATIONS AND RESPONSES</text>
<rect x="14" y="40" width="306" height="112" rx="14" fill="#141E30" stroke="#405572" stroke-width="2"/>
<text id="label-2" x="32" y="70.0" font-size="22" fill="#F3F6FA" font-weight="700" text-anchor="start">T1  ·  13:50</text>
<text id="label-3" x="32" y="109.0" font-size="20" fill="#B4C0D2" font-weight="400" text-anchor="start">Document invitation</text>
<text id="label-4" x="19" y="181" font-size="18" fill="#2DD4BF" font-weight="400" text-anchor="start">Recommended: known route</text>
<text id="label-5" x="19" y="205" font-size="18" fill="#2DD4BF" font-weight="400" text-anchor="start">before signing in.</text>
<path d="M320 96 H379" stroke="#B4C0D2" stroke-width="2" stroke-dasharray="4 5"/>
<text id="label-6" x="351" y="82.0" font-size="20" fill="#B4C0D2" font-weight="400" text-anchor="middle">?</text>
<rect x="379" y="40" width="306" height="112" rx="14" fill="#141E30" stroke="#405572" stroke-width="2"/>
<text id="label-7" x="397" y="70.0" font-size="22" fill="#F3F6FA" font-weight="700" text-anchor="start">T2  ·  14:05</text>
<text id="label-8" x="397" y="109.0" font-size="20" fill="#B4C0D2" font-weight="400" text-anchor="start">Code entered; reported</text>
<text id="label-9" x="384" y="181" font-size="18" fill="#2DD4BF" font-weight="400" text-anchor="start">Confirmed: Aina reported.</text>
<text id="label-10" x="384" y="205" font-size="18" fill="#2DD4BF" font-weight="400" text-anchor="start">IT should review access.</text>
<path d="M685 96 H744" stroke="#B4C0D2" stroke-width="2" stroke-dasharray="4 5"/>
<text id="label-11" x="716" y="82.0" font-size="20" fill="#B4C0D2" font-weight="400" text-anchor="middle">?</text>
<rect x="744" y="40" width="306" height="112" rx="14" fill="#141E30" stroke="#405572" stroke-width="2"/>
<text id="label-12" x="762" y="70.0" font-size="22" fill="#F3F6FA" font-weight="700" text-anchor="start">T3  ·  15:20</text>
<text id="label-13" x="762" y="109.0" font-size="20" fill="#B4C0D2" font-weight="400" text-anchor="start">Bank change + urgent chat</text>
<text id="label-14" x="749" y="181" font-size="18" fill="#2DD4BF" font-weight="400" text-anchor="start">Payment held; callback planned.</text>
<text id="label-15" x="749" y="205" font-size="18" fill="#2DD4BF" font-weight="400" text-anchor="start">Keep normal approval.</text>
<path d="M1050 96 H1109" stroke="#B4C0D2" stroke-width="2" stroke-dasharray="4 5"/>
<text id="label-16" x="1081" y="82.0" font-size="20" fill="#B4C0D2" font-weight="400" text-anchor="middle">?</text>
<rect x="1109" y="40" width="306" height="112" rx="14" fill="#141E30" stroke="#405572" stroke-width="2"/>
<text id="label-17" x="1127" y="70.0" font-size="22" fill="#F3F6FA" font-weight="700" text-anchor="start">T4  ·  15:45</text>
<text id="label-18" x="1127" y="109.0" font-size="20" fill="#B4C0D2" font-weight="400" text-anchor="start">Unsolicited help offer</text>
<text id="label-19" x="1114" y="181" font-size="18" fill="#2DD4BF" font-weight="400" text-anchor="start">No ticket raised. Verify helpdesk;</text>
<text id="label-20" x="1114" y="205" font-size="18" fill="#2DD4BF" font-weight="400" text-anchor="start">do not grant control.</text>
<text id="label-21" x="720" y="246.0" font-size="20" fill="#B4C0D2" font-weight="400" text-anchor="middle">Dotted links: a relationship is not established. Recommended actions are not proof that they happened.</text>
</svg>